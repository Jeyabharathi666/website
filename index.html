<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Screener</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
/* ============ GLOBAL ============ */
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:#f4f7fb;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#111827;
  --text2:#6b7280;
  --primary:#2563eb;
  --green:#16a34a;
  --red:#dc2626;
  --gold:#f4b400;
  --shadow:0 10px 25px rgba(0,0,0,.06);
}

body{
  background:var(--bg);
  font-family:'Inter',sans-serif;
  color:var(--text);
}

body.dark{
  --bg:#0f172a;
  --card:#1e293b;
  --border:#334155;
  --text:#f8fafc;
  --text2:#94a3b8;
}

/* ============ HEADER ============ */
header{
  height:72px;
  background:var(--card);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 32px;
  position:sticky;
  top:0;
  z-index:100;
  border-bottom:1px solid var(--border);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:21px;
  font-weight:700;
  color:var(--primary);
}

.header-right{display:flex;align-items:center;gap:14px;}

.search-box{
  width:300px;
  height:42px;
  background:var(--bg);
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:10px;
  border-radius:10px;
  padding:0 14px;
}
.search-box i{color:var(--text2);font-size:13px;}
.search-box input{
  flex:1;border:none;background:none;outline:none;
  font-size:14px;color:var(--text);font-family:inherit;
}

#darkToggle{
  width:42px;height:42px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg);color:var(--text2);cursor:pointer;font-size:15px;
}

/* ============ TOOLBAR ============ */
.toolbar{
  display:flex;gap:10px;align-items:center;padding:18px 32px;flex-wrap:wrap;
}

.filter{
  background:var(--card);
  border:1px solid var(--border);
  color:var(--text2);
  padding:9px 16px;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  font-size:13px;
  transition:.2s;
}
.filter:hover{border-color:var(--primary);color:var(--primary);}
.filter.active{background:var(--primary);border-color:var(--primary);color:white;}

#refreshBtn{
  margin-left:auto;
  border:none;
  background:var(--green);
  color:white;
  padding:10px 18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  font-size:13px;
  display:flex;align-items:center;gap:8px;
}
#refreshBtn:hover{filter:brightness(1.07);}
#refreshBtn.spin i{animation:spin .7s linear infinite;}

.result-count{
  font-size:13px;color:var(--text2);padding:0 32px 4px;
}

/* ============ TABLE ============ */
.table-container{
  margin:0 32px 40px;
  background:var(--card);
  border-radius:14px;
  overflow:auto;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
}

table{width:100%;border-collapse:collapse;}

thead{background:var(--bg);position:sticky;top:0;z-index:5;}

th{
  padding:14px 16px;
  text-align:left;
  font-size:11.5px;
  text-transform:uppercase;
  letter-spacing:.5px;
  color:var(--text2);
  border-bottom:1px solid var(--border);
  cursor:pointer;
  white-space:nowrap;
}
th:hover{color:var(--primary);}
th .arrow{opacity:0;font-size:9px;margin-left:3px;}
th.sorted .arrow{opacity:1;color:var(--primary);}

td{
  padding:12px 16px;
  border-bottom:1px solid var(--border);
  font-size:14px;
  vertical-align:middle;
}

tbody tr{cursor:pointer;transition:.15s;}
tbody tr:hover td{background:rgba(37,99,235,.04);}
tbody tr:last-child td{border-bottom:none;}

.stock-name{font-weight:700;font-size:14.5px;}
.stock-symbol{font-size:12px;color:var(--text2);margin-top:2px;}

.badge{
  display:inline-block;padding:5px 11px;border-radius:20px;
  font-size:12px;font-weight:600;
}
.green{background:#dcfce7;color:#15803d;}
.red{background:#fee2e2;color:#b91c1c;}
.category-badge{background:#eef2ff;color:#4338ca;}

.stars{color:var(--gold);font-size:16px;letter-spacing:2px;white-space:nowrap;}
.stars .empty{color:#e5e7eb;}
body.dark .stars .empty{color:#334155;}

.trend-cell svg{display:block;}

/* ============ LOADING / EMPTY ============ */
.loading, .empty-row{
  display:flex;justify-content:center;align-items:center;gap:14px;
  padding:50px;color:var(--text2);font-size:14px;
}
.loader{
  width:22px;height:22px;border:3px solid var(--border);
  border-top:3px solid var(--primary);border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ============ MODAL ============ */
.modal{
  position:fixed;inset:0;background:rgba(15,23,42,.55);
  backdrop-filter:blur(4px);display:none;justify-content:center;
  align-items:center;z-index:9999;
}
.modal.show{display:flex;}
.modal-content{
  width:92%;max-width:420px;background:var(--card);border-radius:16px;
  overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25);
}
.modal-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 22px;border-bottom:1px solid var(--border);
}
.modal-header h2{font-size:18px;font-weight:700;}
#closeModal{border:none;background:none;font-size:20px;cursor:pointer;color:var(--text2);}
.modal-body{padding:20px 22px;}
.modal-body .trend-wrap{display:flex;justify-content:center;margin-bottom:14px;}
.detail{
  display:flex;justify-content:space-between;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--border);font-size:13.5px;
}
.detail:last-child{border-bottom:none;}
.detail label{color:var(--text2);font-weight:600;}
.detail span{font-weight:700;}

/* ============ FOOTER ============ */
footer{
  display:flex;justify-content:space-between;padding:16px 32px 32px;
  color:var(--text2);font-size:12.5px;flex-wrap:wrap;gap:8px;
}

/* ============ RESPONSIVE ============ */
@media(max-width:760px){
  header{flex-direction:column;height:auto;padding:16px;gap:12px;}
  .header-right{width:100%;}
  .search-box{width:100%;}
  .toolbar{padding:14px 16px;}
  .table-container{margin:0 16px 24px;}
  footer{padding:12px 16px 24px;}
}
</style>
</head>
<body>

<header>
  <div class="logo"><i class="fa-solid fa-chart-line"></i><span>Stock Screener</span></div>
  <div class="header-right">
    <div class="search-box">
      <i class="fa-solid fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search stock or category…">
    </div>
    <button id="darkToggle" title="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
  </div>
</header>

<section class="toolbar">
  <button class="filter active" data-rating="0">All</button>
  <button class="filter" data-rating="3">★★★</button>
  <button class="filter" data-rating="2">★★☆</button>
  <button class="filter" data-rating="1">★☆☆</button>
  <button id="refreshBtn"><i class="fa-solid fa-rotate"></i>Refresh</button>
</section>

<div class="result-count" id="resultCount"></div>

<main>
  <div class="table-container">
    <table id="stockTable">
      <thead>
        <tr>
          <th data-key="stock">Stock <span class="arrow">▾</span></th>
          <th data-key="category">Category <span class="arrow">▾</span></th>
          <th data-key="rating">Rating <span class="arrow">▾</span></th>
          <th data-key="z">Trend · Low—Avg—High</th>
          <th data-key="aa">M-CAL <span class="arrow">▾</span></th>
          <th data-key="ab">D-CAL <span class="arrow">▾</span></th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="6"><div class="loading"><div class="loader"></div>Loading stocks…</div></td></tr>
      </tbody>
    </table>
  </div>
</main>

<footer>
  <div>Live data from Google Sheets · not sourced from all markets, may be delayed up to 20 minutes</div>
  <div id="lastUpdated">Loading…</div>
</footer>

<!-- ================= MODAL ================= -->
<div id="stockModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle">Stock Details</h2>
      <button id="closeModal"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <div class="trend-wrap" id="modalTrend"></div>
      <div class="detail"><label>Category</label><span id="mCategory"></span></div>
      <div class="detail"><label>Rating</label><span id="mRating"></span></div>
      <div class="detail"><label>Low</label><span id="mF"></span></div>
      <div class="detail"><label>Avg</label><span id="mH"></span></div>
      <div class="detail"><label>High</label><span id="mJ"></span></div>
      <div class="detail"><label>CMP</label><span id="mZ"></span></div>
      <div class="detail"><label>M-CAL</label><span id="mAA"></span></div>
      <div class="detail"><label>D-CAL</label><span id="mAB"></span></div>
    </div>
  </div>
</div>

<script>
// ===========================
// CONFIG
// ===========================
const API = "https://script.google.com/macros/s/AKfycbxNJB_SCY7rgzDcA6cjuuIxfhuVFsaHXjNsHrPbbUcipTMeYcBZtApUGEb4jJflsgg_/exec";
const REFRESH_MS = 60000;

let stocks = [];
let filteredStocks = [];
let sortKey = "rating";
let sortAsc = false;
let activeRatingFilter = 0;

// ===========================
// ELEMENTS
// ===========================
const tbody = document.getElementById("tableBody");
const search = document.getElementById("searchInput");
const refreshBtn = document.getElementById("refreshBtn");
const updated = document.getElementById("lastUpdated");
const resultCount = document.getElementById("resultCount");

// ===========================
// HELPERS
// ===========================
function clean(value){
  if(value === "#N/A" || value === "#VALUE!" || value === "" || value === null || value === undefined) return "";
  return value;
}

function num(value){
  const n = parseFloat(String(clean(value)).replace(/[,₹%\s]/g,""));
  return isNaN(n) ? NaN : n;
}

// rating (0–20) -> star count out of 3
function starCount(value){
  const v = num(value);
  if(isNaN(v) || v <= 0) return 0;
  if(v <= 6) return 1;
  if(v <= 13) return 2;
  return 3;
}

function starsHTML(value){
  const count = starCount(value);
  let html = '<span class="stars">';
  for(let i=0;i<3;i++) html += i < count ? "★" : '<span class="empty">★</span>';
  html += "</span>";
  return html;
}

// ===========================
// REAL-TIME TREND SVG (low / avg / high / cmp)
// ===========================
function trendSVG(low, avg, high, cmp, size){
  size = size || {w:180, h:55};
  low = num(low); avg = num(avg); high = num(high); cmp = num(cmp);

  if([low,avg,high,cmp].some(isNaN) || high <= low || avg <= low || avg >= high){
    return `<svg width="${size.w}" height="${size.h}" viewBox="0 0 140 55"></svg>`;
  }

  // Fixed, uniform anchor coordinates — same for every stock, only the
  // labels/value change. Shape: rise -> flat (Low to Avg) -> rise (Avg to High).
  const xPreLow  = 8,   yPreLow  = 34;
  const xLow     = 25,  yLow     = 20;
  const xAvg     = 75,  yAvg     = 20;   // flat segment: yAvg === yLow
  const xHigh    = 120, yHigh    = 8;
  const xPostHigh= 135, yPostHigh= 4;

  const grey = "#c4c9cc";
  const greyText = "#8a9096";
  const cmpColor = cmp < avg ? "#2e8b7c" : cmp > avg ? "#dc2626" : "#f59e0b";

  const clamp01 = t => Math.max(0, Math.min(1, t));
  const lerp = (a, b, t) => a + (b - a) * t;

  // Place cmp by walking the same fixed path: which segment it falls in
  // depends on its value vs low/avg/high; its position within that
  // segment is proportional to how far along the value range it sits.
  let xCmp, yCmp;
  if(cmp < low){
    const t = clamp01(1 - (low - cmp) / ((high - low) || 1));
    xCmp = lerp(xPreLow, xLow, t);
    yCmp = lerp(yPreLow, yLow, t);
  } else if(cmp <= avg){
    const t = clamp01((cmp - low) / ((avg - low) || 1));
    xCmp = lerp(xLow, xAvg, t);
    yCmp = lerp(yLow, yAvg, t);
  } else if(cmp <= high){
    const t = clamp01((cmp - avg) / ((high - avg) || 1));
    xCmp = lerp(xAvg, xHigh, t);
    yCmp = lerp(yAvg, yHigh, t);
  } else {
    const t = clamp01((cmp - high) / ((high - low) || 1));
    xCmp = lerp(xHigh, xPostHigh, t);
    yCmp = lerp(yHigh, yPostHigh, t);
  }

  const pathPts = `${xPreLow},${yPreLow} ${xLow},${yLow} ${xAvg},${yAvg} ${xHigh},${yHigh}`;

  const anchors = [
    {v:low,  x:xLow,  y:yLow,  color:grey, r:3},
    {v:avg,  x:xAvg,  y:yAvg,  color:grey, r:3},
    {v:high, x:xHigh, y:yHigh, color:grey, r:3}
  ];

  const ticks = anchors.map(p => `<line x1="${p.x}" y1="${p.y-5}" x2="${p.x}" y2="${p.y+5}" stroke="${p.color}" stroke-width="1.5"/>`).join("\n  ");
  const circles = anchors.map(p => `<circle cx="${p.x}" cy="${p.y}" r="${p.r}" fill="${p.color}"/>`).join("\n  ");
  const labels = anchors.map(p => `<text x="${p.x}" y="${p.y+17}" text-anchor="middle" font-size="8" font-family="Inter,sans-serif" fill="${greyText}">${p.v.toLocaleString()}</text>`).join("\n  ");

  return `
<svg width="${size.w}" height="${size.h}" viewBox="0 0 140 55" xmlns="http://www.w3.org/2000/svg">
  <polyline points="${pathPts}" fill="none" stroke="${grey}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  ${ticks}
  <line x1="${xCmp}" y1="${yCmp-6}" x2="${xCmp}" y2="${yCmp+6}" stroke="${cmpColor}" stroke-width="2"/>
  ${circles}
  <circle cx="${xCmp}" cy="${yCmp}" r="3.5" fill="${cmpColor}"/>
  ${labels}
  <text x="${xCmp}" y="${yCmp-9}" text-anchor="middle" font-size="9" font-weight="bold" font-family="Inter,sans-serif" fill="${cmpColor}">${cmp.toLocaleString()}</text>
</svg>`;
}

// ===========================
// LOAD DATA
// ===========================
async function loadStocks(){
  refreshBtn.classList.add("spin");
  tbody.innerHTML = `<tr><td colspan="6"><div class="loading"><div class="loader"></div>Loading stocks…</div></td></tr>`;

  try{
    const response = await fetch(API);
    stocks = await response.json();
    applyFilters();
    updated.textContent = "Updated: " + new Date().toLocaleTimeString();
  } catch(e){
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty-row">Unable to load data. Check the API connection.</div></td></tr>`;
    console.error(e);
  } finally {
    refreshBtn.classList.remove("spin");
  }
}

// ===========================
// FILTER + SORT
// ===========================
function applyFilters(){
  const keyword = search.value.trim().toLowerCase();

  filteredStocks = stocks.filter(s => {
    const matchesSearch = !keyword ||
      String(s.stock||"").toLowerCase().includes(keyword) ||
      String(s.category||"").toLowerCase().includes(keyword);
    const matchesRating = !activeRatingFilter || starCount(s.rating) === activeRatingFilter;
    return matchesSearch && matchesRating;
  });

  filteredStocks.sort((a,b) => {
    let x = a[sortKey], y = b[sortKey];
    const nx = num(x), ny = num(y);
    if(!isNaN(nx) && !isNaN(ny)){ x = nx; y = ny; }
    else { x = String(x||"").toLowerCase(); y = String(y||"").toLowerCase(); }
    if(x < y) return sortAsc ? -1 : 1;
    if(x > y) return sortAsc ? 1 : -1;
    return 0;
  });

  renderTable(filteredStocks);
  resultCount.textContent = `${filteredStocks.length} of ${stocks.length} stocks`;
}

// ===========================
// RENDER TABLE
// ===========================
function renderTable(data){
  if(!data.length){
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty-row">No stocks match your filters</div></td></tr>`;
    return;
  }

  tbody.innerHTML = "";
  data.forEach(stock => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>
        <div class="stock-name">${clean(stock.stock)}</div>
      </td>
      <td><span class="badge category-badge">${clean(stock.category)}</span></td>
      <td>${starsHTML(stock.rating)}</td>
      <td class="trend-cell">${trendSVG(stock.f, stock.h, stock.j, stock.z)}</td>
      <td>${clean(stock.aa)}</td>
      <td>${clean(stock.ab)}</td>
    `;
    row.addEventListener("click", () => openModal(stock));
    tbody.appendChild(row);
  });
}

// ===========================
// MODAL
// ===========================
const modal = document.getElementById("stockModal");

function openModal(stock){
  document.getElementById("modalTitle").textContent = clean(stock.stock);
  document.getElementById("modalTrend").innerHTML = trendSVG(stock.f, stock.h, stock.j, stock.z, {w:220, h:60});
  document.getElementById("mCategory").textContent = clean(stock.category);
  document.getElementById("mRating").innerHTML = starsHTML(stock.rating);
  document.getElementById("mF").textContent = clean(stock.f) ? "₹" + stock.f : "–";
  document.getElementById("mH").textContent = clean(stock.h) ? "₹" + stock.h : "–";
  document.getElementById("mJ").textContent = clean(stock.j) ? "₹" + stock.j : "–";
  document.getElementById("mZ").textContent = clean(stock.z) ? "₹" + stock.z : "–";
  document.getElementById("mAA").textContent = clean(stock.aa) || "–";
  document.getElementById("mAB").textContent = clean(stock.ab) || "–";
  modal.classList.add("show");
}

document.getElementById("closeModal").addEventListener("click", () => modal.classList.remove("show"));
modal.addEventListener("click", e => { if(e.target === modal) modal.classList.remove("show"); });

// ===========================
// EVENTS
// ===========================
refreshBtn.addEventListener("click", loadStocks);
search.addEventListener("input", applyFilters);

document.querySelectorAll(".filter").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeRatingFilter = Number(btn.dataset.rating);
    applyFilters();
  });
});

document.querySelectorAll("th[data-key]").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if(sortKey === key){ sortAsc = !sortAsc; } else { sortKey = key; sortAsc = true; }
    document.querySelectorAll("th").forEach(t => { t.classList.remove("sorted"); const a = t.querySelector(".arrow"); if(a) a.textContent = "▾"; });
    th.classList.add("sorted");
    const arrow = th.querySelector(".arrow");
    if(arrow) arrow.textContent = sortAsc ? "▴" : "▾";
    applyFilters();
  });
});

document.getElementById("darkToggle").addEventListener("click", () => {
  document.body.classList.toggle("dark");
  const icon = document.querySelector("#darkToggle i");
  icon.className = document.body.classList.contains("dark") ? "fa-solid fa-sun" : "fa-solid fa-moon";
});

// ===========================
// START
// ===========================
loadStocks();
setInterval(loadStocks, REFRESH_MS);
</script>

</body>
</html>
